<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlphaVision Terminal - Institutional Grade</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 🛡️ INSTITUTIONAL DEPLOYMENT CHECK v3.1.3 -->
    <div id="deployment-badge" style="position: fixed; top: 0; left: 0; width: 100%; height: 2px; background: #00ff9d; z-index: 99999; box-shadow: 0 0 10px #00ff9d;"></div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        document.body.innerHTML = '<div style="color:white; background:red; padding:20px; font-family:monospace; position:fixed; top:0; left:0; width:100%; z-index:999999;">' +
          '<strong>SYSTEM ERROR:</strong><br>' + msg + '<br>Line: ' + lineNo + '<br>Column: ' + columnNo +
          '</div>';
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML = '<div style="color:white; background:red; padding:20px; font-family:monospace; position:fixed; top:0; left:0; width:100%; z-index:999999;">' +
          '<strong>PROMISE ERROR:</strong><br>' + event.reason +
          '</div>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      console.log("%c ALPHAVISION v3.1.3 DEPLOYED %c", "background: #00ff9d; color: #000; font-weight: bold; padding: 4px; border-radius: 4px;", "");
      window.AV_VERSION = '3.1.3';
    </script>
  </body>
</html>
